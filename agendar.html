<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FBFAF8" />

<title>Agendar horário — Casa Navalha</title>
<meta name="description" content="Reserve seu horário na Casa Navalha: escolha serviço, barbeiro, dia e hora." />
<meta name="robots" content="noindex" />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23FBFAF8'/%3E%3Ctext x='32' y='44' font-family='Inter,Helvetica,sans-serif' font-size='30' font-weight='600' fill='%2316161A' text-anchor='middle'%3ECN%3C/text%3E%3C/svg%3E" />

<!-- O agendamento não carrega a serifada: é um formulário, não
     uma vitrine. Uma família só. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  /* Tailwind só para layout; a aparência vem de assets/css/styles.css */
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif']
        }
      }
    }
  }
</script>

<link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body class="font-sans antialiased">

<!-- ══════════════════════════════════════════════════════════════
     CABEÇALHO
     A marca (que volta ao site) e o telefone. O telefone fica
     visível e rotulado: a página promete cancelamento até 3h antes
     e não existe rota de cancelamento no site — ligar É o
     mecanismo dessa promessa.
     ══════════════════════════════════════════════════════════════ -->
<header class="topo">
  <div class="topo__interno">
    <a href="index.html" class="marca">Casa Navalha</a>
    <a href="tel:+551140028922" class="btn tnum">Ligar (11) 4002-8922</a>
  </div>
</header>

<main class="shell shell--estreito com-barra pt-8">

  <p class="rotulo" id="etapa-contador">Etapa 1 de 4</p>

  <!-- ETAPA 1 · Serviço -->
  <section class="step mt-3" data-step="1" aria-label="Etapa 1: escolha do serviço">
    <h1 class="pergunta">Qual serviço você quer?</h1>
    <div id="svc-list" class="mt-5 grid gap-2"></div>
  </section>

  <!-- ETAPA 2 · Barbeiro -->
  <section class="step hidden mt-3" data-step="2" aria-label="Etapa 2: escolha do barbeiro">
    <h1 class="pergunta">Com quem você quer cortar?</h1>
    <div id="barber-list" class="mt-5 grid gap-2"></div>
  </section>

  <!-- ETAPA 3 · Data e horário -->
  <section class="step hidden mt-3" data-step="3" aria-label="Etapa 3: data e horário">
    <h1 class="pergunta" id="pergunta-horario">Quando fica bom pra você?</h1>

    <!-- Serviço e duração: a etapa 1 está oculta quando esta renderiza,
         então este é o único lugar onde o cliente vê quanto tempo o
         serviço trava — e serviços vão de 30 a 120 min. -->
    <p class="fraco mt-1" id="slot-sub">—</p>

    <div id="date-strip" class="mt-5 flex gap-2 overflow-x-auto no-scrollbar snap-x pb-1"></div>
    <div id="slot-grid" class="mt-5 grid grid-cols-3 sm:grid-cols-4 gap-2"></div>
  </section>

  <!-- ETAPA 4 · Dados do cliente -->
  <section class="step hidden mt-3" data-step="4" aria-label="Etapa 4: seus dados">
    <h1 class="pergunta">Só falta você.</h1>

    <!-- A revisão completa aparece uma vez, no único momento em que
         revisar é uma decisão. Antes ela ficava permanente numa
         coluna lateral e repetida numa barra fixa. -->
    <p class="apoio mt-2" id="revisao">—</p>

    <form id="client-form" class="mt-5 grid gap-4" novalidate>
      <div>
        <label for="f-nome" class="field-label">Nome completo</label>
        <input id="f-nome" name="nome" type="text" autocomplete="name" placeholder="Ex.: Rafael Moreira" class="field" />
        <p class="field-error" data-error-for="nome"></p>
      </div>

      <div>
        <label for="f-tel" class="field-label">WhatsApp</label>
        <input id="f-tel" name="telefone" type="tel" inputmode="numeric" autocomplete="tel"
               placeholder="(11) 99999-9999" maxlength="15" class="field tnum" />
        <p class="field-error" data-error-for="telefone"></p>
      </div>

      <div>
        <label for="f-obs" class="field-label">Observação (opcional)</label>
        <textarea id="f-obs" name="obs" rows="2" placeholder="Ex.: máquina 2 nas laterais." class="field" style="resize:none"></textarea>
      </div>
    </form>
  </section>
</main>

<!-- ══════════════════════════════════════════════════════════════
     BARRA DE AÇÃO
     Único elemento com o acento na tela. Fica fixa embaixo, onde a
     mão está, e leva o resumo como sua própria legenda.
     ══════════════════════════════════════════════════════════════ -->
<div class="acao-barra">
  <div class="acao-barra__interno">
    <button type="button" id="btn-prev" class="btn btn--quiet" disabled>Voltar</button>

    <p class="acao-barra__resumo" id="barra-resumo">Sem cartão · cancele pelo WhatsApp até 3h antes</p>

    <button type="button" id="btn-next" class="btn btn--primary" disabled>
      <span id="btn-next-label">Escolha um serviço</span>
    </button>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════
     MODAL DE CONFIRMAÇÃO
     Herói: data e hora — o único dado que cria obrigação no mundo
     real. Ação primária: enviar no WhatsApp, porque num protótipo
     estático o localStorage do cliente nunca encontra o do painel:
     essa mensagem é o único caminho até a barbearia.
     ══════════════════════════════════════════════════════════════ -->
<div id="confirm-modal" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-quando">
  <div class="overlay__backdrop" data-close-modal></div>

  <div class="overlay__wrap">
    <div class="overlay__card p-6">
      <p class="rotulo">Horário reservado</p>
      <p id="confirm-quando" class="t1 mt-1 tnum">—</p>
      <p id="confirm-detalhe" class="apoio mt-2">—</p>

      <p class="mt-5 pt-5 border-t" style="border-color:var(--line)">
        <a id="confirm-mapa" href="#" target="_blank" rel="noopener" class="underline underline-offset-4">—</a>
      </p>
      <p class="fraco mt-1">Chegue 5 minutos antes.</p>

      <div class="mt-6 grid gap-2">
        <a id="confirm-wa" href="#" target="_blank" rel="noopener" class="btn btn--primary">
          Enviar no WhatsApp
        </a>
        <div class="flex items-center justify-between">
          <button type="button" id="confirm-ics" class="btn btn--quiet">Adicionar à agenda</button>
          <button type="button" data-close-modal class="btn btn--quiet">Novo agendamento</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Área de notificações (toasts) -->
<div id="toasts" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-[70] w-[min(94vw,24rem)] grid gap-2 pointer-events-none"></div>

<!-- ── Scripts do agendamento ── -->
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/booking.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    CN.ui.init();       /* lazy-load de imagens e toasts */
    CN.booking.init();  /* fluxo de 4 etapas */
  });
</script>
</body>
</html>
